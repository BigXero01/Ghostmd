name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '20'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://ghostmd:test@localhost:5432/ghostmd_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-32-characters-min
          REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-min
          STRIPE_SECRET_KEY: sk_test_placeholder

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ghostmd
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ghostmd_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx turbo run build --filter=@ghostmd/types --filter=@ghostmd/utils

      - name: Build applications
        run: npx turbo run build --filter=@ghostmd/api --filter=@ghostmd/web
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

  docker-deploy:
    name: Docker Build + Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t $ECR_REGISTRY/ghostmd-api:$IMAGE_TAG .
          docker push $ECR_REGISTRY/ghostmd-api:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ghostmd-api:$IMAGE_TAG $ECR_REGISTRY/ghostmd-api:latest
          docker push $ECR_REGISTRY/ghostmd-api:latest

      - name: Build and push Web image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} \
            -t $ECR_REGISTRY/ghostmd-web:$IMAGE_TAG .
          docker push $ECR_REGISTRY/ghostmd-web:$IMAGE_TAG
          docker tag $ECR_REGISTRY/ghostmd-web:$IMAGE_TAG $ECR_REGISTRY/ghostmd-web:latest
          docker push $ECR_REGISTRY/ghostmd-web:latest

      - name: Update ECS service - API
        run: |
          aws ecs update-service \
            --cluster ghostmd-cluster \
            --service ghostmd-api \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}

      - name: Update ECS service - Web
        run: |
          aws ecs update-service \
            --cluster ghostmd-cluster \
            --service ghostmd-web \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}
