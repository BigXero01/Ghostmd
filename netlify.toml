[build]
  # Install the full npm workspace at the repo root before building so that
  # workspace dependencies (e.g. `next` for @ghostmd/web) are guaranteed to be
  # present in node_modules/.bin. This prevents "next: not found" when Netlify
  # restores a partial/cached node_modules for the monorepo package.
  command = "npm install && turbo run build --filter @ghostmd/web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
